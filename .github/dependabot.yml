version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
